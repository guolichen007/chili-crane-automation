name: Static contracts

on:
  push:
    branches:
      - main
      - "codex/**"
  pull_request:

permissions:
  contents: read

jobs:
  static-contracts:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install static-check dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run repository contracts
        run: python tools/check_repo_contracts.py

      - name: Run static unit tests
        run: python -m unittest discover -s tests_static -p "test_*.py"

      - name: Check reviewable public delivery and new commit titles
        run: python tools/check_delivery.py --event-path "$GITHUB_EVENT_PATH" --ci
